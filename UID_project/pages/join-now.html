<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../style/join-now.css">
        <link rel="stylesheet" href="../style/index.css">
        <link rel="shortcut icon" href="https://about.starbucks.com/uploads/2024/10/cropped-favicon-300x300.png" type="image/x-icon">
        <title>Starbucks Coffee Company</title>
    </head>

    <body>
        
        <header>
            <div class="logo">
                <div>
                    <img class="logo-img" src="../images/logo.webp" alt="logo">
                </div>
                <div>
                    <img class="icon" id="bar" src="../images/bars.svg" alt="">
                    <img class="icon" id="cross" src="../images/cross.svg" alt="">
                </div>
            </div>
        </header>

        <div class="join-container">
    <div class="join-card">
        <div class="join-header">
            <img src="../images/logo.webp" alt="Starbucks Logo" class="logo">
            <h1>Join now</h1>
            <p>Create an account to start earning rewards</p>
        </div>

        <form class="join-form">
            <div class="input-group">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
                <span class="password-hint">Must be at least 8 characters</span>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Use</a> and <a href="#">Privacy Notice</a></label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="offers">
                <label for="offers">Yes, I'd like to receive exclusive offers and promotions via email</label>
            </div>

            <button type="submit" class="join-btn">Join now</button>

            <div class="divider">
                <span>or</span>
            </div>

            <button type="button" class="google-btn">
                <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <button type="button" class="apple-btn">
                <svg class="apple-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.04 2.29.73 3.07.75.78-.02 1.72-.71 3.07-.75 2.52.13 3.92 1.28 4.75 2.98-2.55 1.5-2.61 4.5-.15 6.12-.85 1.65-2.07 2.96-3.74 3.87zM12.07 7.3c-.24-2.01 1.49-3.74 3.26-4.04.24 1.84-1.53 3.57-3.26 4.04z" fill="#000000"/>
                </svg>
                Continue with Apple
            </button>
        </form>

        <div class="signin-link">
            <p>Already have an account? <a href="#">Sign in</a></p>
        </div>
    </div>
</div>
        
    </body>
</html>
